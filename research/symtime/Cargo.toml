[package]
name = "symtime"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
spur-time = { path = "../../spur/spur-time" }
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde_json = "1.0"
z3 = "0.12"
yices2-sys = { version = "2.6.4", default-features = false, features = ["gcc"], optional = true }

[features]
with-yices = ["dep:yices2-sys"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
